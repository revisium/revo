sonar.projectKey=revisium_revo
sonar.organization=revisium
sonar.projectName=revo
sonar.sourceEncoding=UTF-8

sonar.sources=src,installer,scripts
sonar.tests=test
sonar.test.inclusions=test/**/*.ts,test/**/*.mjs
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.coverage.exclusions=installer/**,scripts/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The shell scripts (install.sh, smoke-install.sh, sonar-issues-local.sh) are gated by ShellCheck,
# and the POSIX sh ones have no `local`. These two bash-style rules do not apply to them.
sonar.issue.ignore.multicriteria=shellReturn,shellParams
sonar.issue.ignore.multicriteria.shellReturn.ruleKey=shelldre:S7682
sonar.issue.ignore.multicriteria.shellReturn.resourceKey=**/*.sh
sonar.issue.ignore.multicriteria.shellParams.ruleKey=shelldre:S7679
sonar.issue.ignore.multicriteria.shellParams.resourceKey=**/*.sh
